<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test SVG Filmstrip Stepping</title>
</head>
<body style="background: #111; color: white;">
  <svg width="400" height="200" viewBox="0 0 400 200" style="background: #000; border: 1px solid #333;">
    <style>
      #filmstrip {
        animation: play 3s steps(3) infinite;
      }
      @keyframes play {
        from { transform: translateY(0px); }
        to { transform: translateY(-600px); }
      }
    </style>
    <g id="filmstrip">
      <!-- Frame 0: 0 to 200 -->
      <g transform="translate(0, 0)">
        <circle cx="200" cy="100" r="60" fill="gold"/>
        <text x="200" y="105" fill="black" text-anchor="middle" font-size="24" font-weight="bold">FRAME 0</text>
      </g>
      <!-- Frame 1: 200 to 400 -->
      <g transform="translate(0, 200)">
        <circle cx="200" cy="100" r="60" fill="cyan"/>
        <text x="200" y="105" fill="black" text-anchor="middle" font-size="24" font-weight="bold">FRAME 1</text>
      </g>
      <!-- Frame 2: 400 to 600 -->
      <g transform="translate(0, 400)">
        <circle cx="200" cy="100" r="60" fill="crimson"/>
        <text x="200" y="105" fill="black" text-anchor="middle" font-size="24" font-weight="bold">FRAME 2</text>
      </g>
    </g>
  </svg>
</body>
</html>
